apiVersion: v1
kind: ConfigMap
metadata:
  name: smrt-saas-config
data:
  PUBLIC_APP_NAME: "SMRT SaaS Starter"
  # Kanidm serves OIDC discovery per client at /oauth2/openid/<client-id>/,
  # not at the IDP root (the root issuer 404s on discovery). Replace the
  # client id segment with the deployment's OIDC client.
  HAPPYVERTICAL_IDP_ISSUER: "https://idp.happyvertical.com/oauth2/openid/smrt-saas-starter"
  LOG_LEVEL: "info"
  WORKER_MODE: "runner"
  WORKER_QUEUE: "starter-maintenance"
  WORKER_RUN_AGENT_QUEUE: "true"
  WORKER_RUN_SCHEDULER: "true"
  WORKER_ENSURE_MAINTENANCE_SCHEDULES: "true"
  # Report exports use the SMRT AssetStore backed by this S3-compatible
  # provider. Production credentials are supplied by smrt-saas-assets-s3.
  SMRT_ASSETS_STORAGE_TYPE: "s3"
  SMRT_ASSETS_S3_BUCKET: "smrt-saas-assets"
  SMRT_ASSETS_S3_REGION: "garage"
  SMRT_ASSETS_S3_ENDPOINT: "http://garage.garage.svc.cluster.local:3900"
  SMRT_ASSETS_S3_FORCE_PATH_STYLE: "true"
  # Tenant context can be selected with the `x-tenant-id` request header. That
  # header is unauthenticated client input (it sets the ambient tenant before
  # any session/membership check), so it is ignored unless this is "true".
  # Only enable behind an authenticating gateway/BFF that injects the header
  # after its own auth; browser flows use the membership-gated switch cookie or
  # the tenant subdomain instead.
  SMRT_STARTER_TRUST_TENANT_HEADER: "false"
  # Comma/space-separated allow list of registered mobile auth redirect URIs.
  # When non-empty, mobile auth start/complete reject any redirect URI not in
  # the list. Leave empty to allow any non-dangerous scheme (https, native
  # loopback http, or private-use app schemes). An entry ending in "/" matches
  # as a path prefix so one origin can cover its callback sub-paths.
  MOBILE_AUTH_ALLOWED_REDIRECT_URIS: ""
  # Same redirect-URI allow list, scoped to the built-in HappyVertical IDP
  # provider. Merged with MOBILE_AUTH_ALLOWED_REDIRECT_URIS at request time.
  MOBILE_AUTH_HAPPYVERTICAL_REDIRECT_URIS: ""
