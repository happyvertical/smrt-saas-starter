apiVersion: v1
kind: ConfigMap
metadata:
  name: smrt-saas-config
data:
  PUBLIC_APP_NAME: "SMRT SaaS Starter"
  HAPPYVERTICAL_IDP_ISSUER: "https://idp.happyvertical.com"
  LOG_LEVEL: "info"
  WORKER_MODE: "runner"
  WORKER_QUEUE: "starter-maintenance"
  WORKER_RUN_AGENT_QUEUE: "true"
  WORKER_RUN_SCHEDULER: "true"
  WORKER_ENSURE_MAINTENANCE_SCHEDULES: "true"
