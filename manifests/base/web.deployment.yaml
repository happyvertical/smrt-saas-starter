apiVersion: apps/v1
kind: Deployment
metadata:
  name: smrt-saas-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smrt-saas-web
  template:
    metadata:
      labels:
        app: smrt-saas-web
    spec:
      containers:
        - name: web
          image: ghcr.io/happyvertical/smrt-saas-starter-web:dev-latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: smrt-saas-config
            - secretRef:
                name: smrt-saas-secret
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
