apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smrt-saas-dev
resources:
  - ../../base
# Digests below are all-zero placeholders. CI replaces them with the real
# published image digests via `node scripts/update-manifest-digests.mjs dev
# <webDigest> <workerDigest>` before deploy. Do not `kubectl apply` this
# overlay with the placeholder digest — the image pull will fail.
images:
  - name: ghcr.io/happyvertical/smrt-saas-starter-web
    newTag: dev-latest
    digest: sha256:824b9f2ba90f6f09c696189c15c1487ca7a01f6715e84c8176e636672bb302f1
  - name: ghcr.io/happyvertical/smrt-saas-starter-worker
    newTag: dev-latest
    digest: sha256:f0bcb02057587fbcfd23dd817bed64e46eb2c5b1af61248a11012dbdc4cedfe3
patches:
  - target:
      kind: ConfigMap
      name: smrt-saas-config
    patch: |-
      - op: replace
        path: /data/PUBLIC_APP_NAME
        value: SMRT SaaS Starter Dev
