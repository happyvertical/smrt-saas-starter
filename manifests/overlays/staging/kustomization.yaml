apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smrt-saas-staging
resources:
  - ../../base
images:
  - name: ghcr.io/happyvertical/smrt-saas-starter-web
    newTag: staging-latest
  - name: ghcr.io/happyvertical/smrt-saas-starter-worker
    newTag: staging-latest
patches:
  - target:
      kind: ConfigMap
      name: smrt-saas-config
    patch: |-
      - op: replace
        path: /data/PUBLIC_APP_NAME
        value: SMRT SaaS Starter Staging
