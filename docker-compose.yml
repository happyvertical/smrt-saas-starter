services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: smrt_saas
      POSTGRES_PASSWORD: localdev
      POSTGRES_USER: smrt_saas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smrt_saas -d smrt_saas"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
