name: Promote runtime candidate
description: Verify and retag an immutable CI candidate, then update the environment manifest.

inputs:
  environment:
    description: dev, staging, or production
    required: true
  source-sha:
    description: Commit whose verified candidate will be promoted
    required: true
  candidate-run-id:
    description: Optional explicit recovery workflow run ID
    required: false
    default: ""

outputs:
  app-version:
    description: Source commit baked into the promoted web image
    value: ${{ steps.candidate-meta.outputs.source-commit }}

runs:
  using: composite
  steps:
    - name: Locate unique successful candidate run
      id: candidate-run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EXPLICIT_RUN_ID: ${{ inputs.candidate-run-id }}
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: |
        if [ -n "$EXPLICIT_RUN_ID" ]; then
          run_ids=("$EXPLICIT_RUN_ID")
          candidate_source_sha=""
        else
          mapfile -t run_ids < <(gh run list \
            --workflow on-pull-request.yml \
            --commit "$SOURCE_SHA" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId')
          candidate_source_sha="$SOURCE_SHA"
          if [ "${#run_ids[@]}" -eq 0 ]; then
            mapfile -t pr_heads < <(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls" \
              --jq '.[] | select(.merged_at != null) | .head.sha' | sort -u)
            if [ "${#pr_heads[@]}" -ne 1 ]; then
              echo "Expected one merged PR for $SOURCE_SHA; found ${#pr_heads[@]}"
              exit 1
            fi
            candidate_source_sha="${pr_heads[0]}"
            mapfile -t run_ids < <(gh run list \
              --workflow on-pull-request.yml \
              --commit "$candidate_source_sha" \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId')
          fi
        fi

        tested_tree=$(git rev-parse 'HEAD^{tree}')
        matching_runs=()
        for candidate_run_id in "${run_ids[@]}"; do
          destination=".ci/candidates/$candidate_run_id"
          if ! gh run download "$candidate_run_id" \
            --name runtime-candidate --dir "$destination"; then
            continue
          fi
          artifact_tree=$(CANDIDATE_PATH="$destination/runtime-candidate.json" node -e '
            const { readFileSync } = require("node:fs");
            const candidate = JSON.parse(readFileSync(process.env.CANDIDATE_PATH, "utf8"));
            process.stdout.write(candidate.testedTree || "");
          ')
          if [ "$artifact_tree" = "$tested_tree" ]; then
            matching_runs+=("$candidate_run_id")
          fi
        done
        if [ "${#matching_runs[@]}" -ne 1 ]; then
          echo "Expected exactly one verified candidate for tree $tested_tree; found ${#matching_runs[@]}"
          exit 1
        fi
        run_id="${matching_runs[0]}"
        mkdir -p .ci/candidate
        cp ".ci/candidates/$run_id/runtime-candidate.json" .ci/candidate/runtime-candidate.json
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
        echo "candidate-source-sha=$candidate_source_sha" >> "$GITHUB_OUTPUT"

    - name: Verify candidate provenance
      id: candidate-meta
      shell: bash
      env:
        CANDIDATE_SOURCE_SHA: ${{ steps.candidate-run.outputs.candidate-source-sha }}
      run: |
        tested_tree=$(git rev-parse 'HEAD^{tree}')
        if [ -n "$CANDIDATE_SOURCE_SHA" ]; then
          node scripts/verify-runtime-candidate.mjs \
            .ci/candidate/runtime-candidate.json "$CANDIDATE_SOURCE_SHA" "$tested_tree"
        else
          node scripts/verify-runtime-candidate.mjs \
            .ci/candidate/runtime-candidate.json "" "$tested_tree"
        fi
        source_commit=$(node -p \
          "JSON.parse(require('node:fs').readFileSync('.ci/candidate/runtime-candidate.json')).sourceCommit")
        echo "source-commit=$source_commit" >> "$GITHUB_OUTPUT"

    - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

    - name: Promote immutable image digests
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: |
        node --input-type=module <<'NODE' > .ci/candidate/images.env
        import { readFileSync } from 'node:fs';
        const candidate = JSON.parse(readFileSync('.ci/candidate/runtime-candidate.json', 'utf8'));
        for (const image of candidate.images) {
          const key = image.name.endsWith('-web') ? 'WEB' : 'WORKER';
          console.log(`${key}_IMAGE=${image.name}`);
          console.log(`${key}_DIGEST=${image.digest}`);
        }
        NODE
        source .ci/candidate/images.env
        docker buildx imagetools create \
          --tag "$WEB_IMAGE:$ENVIRONMENT-$SOURCE_SHA" \
          --tag "$WEB_IMAGE:$ENVIRONMENT-latest" \
          "$WEB_IMAGE@$WEB_DIGEST"
        docker buildx imagetools create \
          --tag "$WORKER_IMAGE:$ENVIRONMENT-$SOURCE_SHA" \
          --tag "$WORKER_IMAGE:$ENVIRONMENT-latest" \
          "$WORKER_IMAGE@$WORKER_DIGEST"
        docker buildx imagetools inspect "$WEB_IMAGE@$WEB_DIGEST" >/dev/null
        docker buildx imagetools inspect "$WORKER_IMAGE@$WORKER_DIGEST" >/dev/null

    - name: Update deployment manifest from candidate
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: |
        node scripts/update-manifest-digests.mjs \
          --candidate .ci/candidate/runtime-candidate.json \
          "$ENVIRONMENT" "${{ steps.candidate-meta.outputs.source-commit }}"
        node scripts/check-manifests.mjs
        node scripts/render-manifests.mjs
