name: Setup environment
description: Install the repository-pinned Node and pnpm toolchain and optional workspace dependencies.

inputs:
  install-deps:
    description: Install workspace dependencies with the frozen lockfile.
    required: false
    default: "true"
  setup-playwright:
    description: Install the Chromium runtime used by Playwright.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Read package-manager pin
      id: toolchain
      shell: bash
      run: |
        pnpm_version="$(node -e "const value=require('./package.json').packageManager||''; const match=/^pnpm@(.+)$/.exec(value); if (!match) process.exit(1); process.stdout.write(match[1])")"
        echo "pnpm-version=$pnpm_version" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: ${{ steps.toolchain.outputs.pnpm-version }}
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: "24.18.0"
        cache: pnpm

    - name: Configure runner temp directory
      shell: bash
      run: |
        temp_dir="${CI_TEST_TMPDIR:-$RUNNER_TEMP}"
        mkdir -p "$temp_dir"
        echo "TMPDIR=$temp_dir" >> "$GITHUB_ENV"

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --loglevel error
      env:
        NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN || env.GH_PACKAGES_TOKEN || env.GITHUB_PACKAGES_TOKEN || github.token }}
        ONNXRUNTIME_NODE_INSTALL_CUDA: skip

    - name: Install Playwright Chromium
      if: inputs.install-deps == 'true' && inputs.setup-playwright == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
