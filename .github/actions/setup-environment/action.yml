name: Setup environment
description: Install the repository-pinned Node and pnpm toolchain and optional workspace dependencies.

inputs:
  install-deps:
    description: Install workspace dependencies with the frozen lockfile.
    required: false
    default: "true"

outputs:
  pnpm-cache-hit:
    description: Whether the pnpm store cache was restored.
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}
  remote-cache-mode:
    description: Whether an optional Turbo remote cache is configured.
    value: ${{ steps.cache-mode.outputs.mode }}
  setup-seconds:
    description: Elapsed time spent setting up the toolchain and optional dependencies.
    value: ${{ steps.complete.outputs.seconds }}

runs:
  using: composite
  steps:
    - name: Start setup timer
      id: started
      shell: bash
      run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "24.18.0"

    - name: Activate pnpm from packageManager
      shell: bash
      run: |
        package_manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
        if [[ "$package_manager" != pnpm@* ]]; then
          echo "package.json#packageManager must pin pnpm (found: $package_manager)" >&2
          exit 1
        fi
        corepack enable
        corepack prepare "$package_manager" --activate

    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      id: pnpm-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ runner.arch }}-

    - name: Detect optional Turbo remote cache
      id: cache-mode
      shell: bash
      run: |
        if [[ -n "${TURBO_TEAM:-}" && -n "${TURBO_TOKEN:-}" ]]; then
          echo "mode=remote-configured" >> "$GITHUB_OUTPUT"
        else
          echo "mode=cold-local" >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Record setup duration
      id: complete
      shell: bash
      run: echo "seconds=$(( $(date +%s) - ${{ steps.started.outputs.seconds }} ))" >> "$GITHUB_OUTPUT"
