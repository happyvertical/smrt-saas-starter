name: Promote Dev To Staging

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: dev
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
      - uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: Verify deploy manifests before promotion
        run: |
          node scripts/check-manifests.mjs
          node scripts/render-manifests.mjs
      - name: Open dev to staging PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base staging --head dev \
            --title "chore: promote dev to staging" \
            --body "Automated promotion of the verified dev candidate." \
          || gh pr list --base staging --head dev --json url --jq '.[0].url'
