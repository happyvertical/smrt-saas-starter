name: Promote Dev To Staging

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  pull-requests: write

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GH_TOKEN }}

jobs:
  promote:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: smrt_saas
          POSTGRES_PASSWORD: localdev
          POSTGRES_USER: smrt_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smrt_saas -d smrt_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://smrt_saas:localdev@127.0.0.1:5432/smrt_saas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
      - uses: ./.github/actions/setup-environment
      - name: Validate dev before promotion
        run: pnpm check
      - name: Open dev to staging PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base staging \
            --head dev \
            --title "chore: promote dev to staging" \
            --body "Automated promotion from dev to staging." \
          || gh pr list --base staging --head dev --json url --jq '.[0].url'
