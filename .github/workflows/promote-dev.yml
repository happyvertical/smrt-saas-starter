name: Promote Dev To Staging

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
      - uses: ./.github/actions/setup-environment
      - name: Validate dev before promotion
        run: pnpm check
      - name: Open dev to staging PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base staging \
            --head dev \
            --title "chore: promote dev to staging" \
            --body "Automated promotion from dev to staging." \
          || gh pr list --base staging --head dev --json url --jq '.[0].url'
