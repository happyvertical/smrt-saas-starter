name: Nightly PostgreSQL Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
    - cron: "15 * * * *"

concurrency:
  group: postgres-registry
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  postgres-shared:
    name: Registered PostgreSQL Suites (shared lane)
    if: (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *') && vars.CI_POSTGRES_ENABLED == 'true'
    runs-on: arc-happyvertical-node
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-environment
      - name: Build registered database dependency closure
        run: pnpm --filter @happyvertical/smrt-saas-objects build
      - name: Run full PostgreSQL registry without cache
        run: pnpm test:postgres
        env:
          CI_POSTGRES_BASE_URL_FILE: /var/run/ci-services/postgres/url
          TURBO_FORCE: "true"

  postgres-fallback:
    name: Registered PostgreSQL Suites (service fallback)
    if: (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *') && vars.CI_POSTGRES_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_USER: smrt_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smrt_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-environment
      - name: Build registered database dependency closure
        run: pnpm --filter @happyvertical/smrt-saas-objects build
      - name: Run full PostgreSQL registry without cache
        run: pnpm test:postgres
        env:
          CI_POSTGRES_BASE_URL: postgresql://smrt_ci:localdev@127.0.0.1:5432/postgres
          TURBO_FORCE: "true"

  cleanup:
    name: Remove Abandoned CI Databases
    if: always() && vars.CI_POSTGRES_ENABLED == 'true'
    needs: postgres-shared
    runs-on: arc-happyvertical-node
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
      - name: Drop databases older than six hours
        run: node scripts/cleanup-ci-postgres.mjs
        env:
          CI_POSTGRES_BASE_URL_FILE: /var/run/ci-services/postgres/url
          CI_POSTGRES_EXPECTED_HOST: ${{ vars.CI_POSTGRES_EXPECTED_HOST }}
          CI_POSTGRES_EXPECTED_USER: ${{ vars.CI_POSTGRES_EXPECTED_USER }}
