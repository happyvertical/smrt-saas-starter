name: Pull Request

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number ||
      github.event.merge_group.head_sha ||
      github.ref
    }}-${{
      (github.event_name == 'pull_request' &&
      github.event.action == 'edited' &&
      github.event.changes.title != null &&
      github.event.changes.base == null) &&
      'title' ||
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      !contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      !(github.event.action == 'edited' && github.event.changes.base != null))) &&
      'lifecycle' ||
      'validation'
    }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GH_TOKEN }}

jobs:
  # hv-agent-validation-dependency:start
  lifecycle:
    name: lifecycle / validation dependency
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action))
    runs-on: arc-happyvertical
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Preserve repository validation dependencies
        run: echo 'The dedicated Agent Policy workflow publishes the lifecycle context.'
  # hv-agent-validation-dependency:end


  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: smrt_saas
          POSTGRES_PASSWORD: localdev
          POSTGRES_USER: smrt_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smrt_saas -d smrt_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 36
    env:
      DATABASE_URL: postgresql://smrt_saas:localdev@127.0.0.1:5432/smrt_saas
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
      - name: Validate
        run: pnpm check

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: smrt_saas
          POSTGRES_PASSWORD: localdev
          POSTGRES_USER: smrt_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smrt_saas -d smrt_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 36
    env:
      DATABASE_URL: postgresql://smrt_saas:localdev@127.0.0.1:5432/smrt_saas
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
      # The web app and its db scripts import @happyvertical/smrt-saas-objects
      # from dist/, so build it before seeding on a fresh runner.
      - name: Build workspace objects
        run: pnpm --filter @happyvertical/smrt-saas-objects build
      - name: Seed database
        run: pnpm db:seed
      - name: Install Playwright browsers
        run: pnpm --filter @happyvertical/smrt-saas-web exec playwright install --with-deps chromium
      - name: Browser smoke
        run: pnpm --filter @happyvertical/smrt-saas-web test:e2e

  mobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: ./.github/actions/setup-environment
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate Android shell
        run: pnpm mobile:validate:android

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Azure/setup-kubectl@v5.1.0
      - uses: ./.github/actions/setup-environment
      - name: Validate runtime artifacts
        run: pnpm runtime:check

  validation-gate:
    name: Required CI / validation
    if: always()
    needs: [lifecycle, check, e2e, mobile-android, runtime]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Verify or preserve required validation
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          LIFECYCLE: ${{ needs.lifecycle.result }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          MOBILE: ${{ needs.mobile-android.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: |
          set -euo pipefail
          if [ "$LIFECYCLE" != success ]; then
            echo "::error::Lifecycle policy failed: $LIFECYCLE"
            exit 1
          fi

          for result in "$CHECK" "$E2E" "$MOBILE" "$RUNTIME"; do
            if [ "$result" != success ]; then
              echo "::error::Required repository job failed or skipped: $result"
              exit 1
            fi
          done
          echo "Validation baseline passed for $EVENT_NAME"

  required-ci:
    name: Required CI
    if: always()
    needs: [validation-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Require full validation
        env:
          VALIDATION: ${{ needs.validation-gate.result }}
        run: |
          set -euo pipefail
          [ "$VALIDATION" = success ] || {
            echo "::error::Required validation failed: $VALIDATION"
            exit 1
          }
