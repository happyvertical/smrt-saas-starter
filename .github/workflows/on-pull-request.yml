name: Pull Request

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GH_TOKEN }}
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_TIMEOUT: "5"

jobs:
  check:
    name: Check
    outputs:
      pnpm-cache-hit: ${{ steps.setup.outputs.pnpm-cache-hit }}
      remote-cache-mode: ${{ steps.setup.outputs.remote-cache-mode }}
      setup-seconds: ${{ steps.setup.outputs.setup-seconds }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: smrt_saas
          POSTGRES_PASSWORD: localdev
          POSTGRES_USER: smrt_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smrt_saas -d smrt_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 36
    env:
      DATABASE_URL: postgresql://smrt_saas:localdev@127.0.0.1:5432/smrt_saas
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: ./.github/actions/setup-environment
      - name: Format
        run: pnpm run format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Database smoke
        run: pnpm run db:smoke

  metadata:
    name: Metadata validation
    outputs:
      pnpm-cache-hit: ${{ steps.setup.outputs.pnpm-cache-hit }}
      remote-cache-mode: ${{ steps.setup.outputs.remote-cache-mode }}
      setup-seconds: ${{ steps.setup.outputs.setup-seconds }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          install-deps: "false"
      - name: Dependency validation
        run: node scripts/check-dependencies.mjs
      - name: Workflow validation
        run: node scripts/check-workflows.mjs
      - name: Manifest validation
        run: node scripts/check-manifests.mjs
      - name: SOPS validation
        run: node scripts/check-sops.mjs
      - name: Deployment scaffold validation
        run: node scripts/validate-scaffold.mjs

  e2e:
    name: Production-image E2E
    outputs:
      pnpm-cache-hit: ${{ steps.setup.outputs.pnpm-cache-hit }}
      remote-cache-mode: ${{ steps.setup.outputs.remote-cache-mode }}
      setup-seconds: ${{ steps.setup.outputs.setup-seconds }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: ./.github/actions/setup-environment
      - name: Install Playwright browser dependencies
        run: pnpm --filter @happyvertical/smrt-saas-web exec playwright install --with-deps chromium
      - name: Install sandbox-capable Chrome for Testing
        env:
          CHROME_FOR_TESTING_VERSION: 153.0.8010.36
          CHROME_FOR_TESTING_SHA256: 167a098c4fdec156b58a9f678c90a84f9072d789f9c6e7b35496a6987b8b7ef8
          GOOGLE_CHROME_STABLE_SHA256: 9bb44e33031c2f2857cf36b4343051a12f93058e4b781e3c76313df87f6c8d32
        run: |
          set -euo pipefail
          chrome_root="$RUNNER_TEMP/chrome-for-testing-$CHROME_FOR_TESTING_VERSION"
          archive="$RUNNER_TEMP/chrome-for-testing-$CHROME_FOR_TESTING_VERSION-linux64.zip"
          mkdir -p "$chrome_root"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_FOR_TESTING_VERSION/linux64/chrome-linux64.zip" \
            --output "$archive"
          echo "$CHROME_FOR_TESTING_SHA256  $archive" | sha256sum --check --status
          unzip -q "$archive" -d "$chrome_root"
          chrome="$chrome_root/chrome-linux64/chrome"
          test -x "$chrome"
          "$chrome" --version | grep -F "$CHROME_FOR_TESTING_VERSION"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          # Ubuntu restricts unprivileged user namespaces for downloaded browser
          # builds. Install the matching, official Chrome Stable package through
          # apt so its packaged AppArmor profile and root-owned setuid helper are
          # present. The CFT executable above remains checksum-pinned and is the
          # only executable used by Playwright; do not alter host policy or helper
          # ownership/mode.
          chrome_deb="$RUNNER_TEMP/google-chrome-stable-$CHROME_FOR_TESTING_VERSION-amd64.deb"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_${CHROME_FOR_TESTING_VERSION}-1_amd64.deb" \
            --output "$chrome_deb"
          echo "$GOOGLE_CHROME_STABLE_SHA256  $chrome_deb" | sha256sum --check --status
          sudo apt-get install --yes "$chrome_deb"
          google-chrome --product-version | grep -F "$CHROME_FOR_TESTING_VERSION"
          sandbox_helper=/opt/google/chrome/chrome-sandbox
          helper_owner="$(stat -c '%U:%G' "$sandbox_helper" 2>&1 || true)"
          helper_mode="$(stat -c '%a' "$sandbox_helper" 2>&1 || true)"
          printf 'Chrome sandbox helper: path=%s owner=%s mode=%s\n' \
            "$sandbox_helper" "$helper_owner" "$helper_mode"
          if ! test -u "$sandbox_helper" \
            || test "$helper_owner" != root:root \
            || ! test "$helper_mode" = 4755; then
            echo 'FATAL: official Chrome sandbox helper is not a root-owned 4755 file.' >&2
            exit 1
          fi
          echo "CHROME_DEVEL_SANDBOX=$sandbox_helper" >> "$GITHUB_ENV"
      - name: Verify Chrome sandbox support
        run: |
          node - <<'NODE'
          const { chromium } = require("./apps/web/node_modules/playwright");
          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH,
              chromiumSandbox: true,
              headless: true,
            });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Production-image browser and migration gate
        run: pnpm run test:e2e:production
      - name: Upload production E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/production-e2e/
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

  mobile-android:
    name: Android shell validation
    outputs:
      pnpm-cache-hit: ${{ steps.setup.outputs.pnpm-cache-hit }}
      remote-cache-mode: ${{ steps.setup.outputs.remote-cache-mode }}
      setup-seconds: ${{ steps.setup.outputs.setup-seconds }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - id: setup
        uses: ./.github/actions/setup-environment
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate Android shell
        run: pnpm run mobile:validate:android

  runtime:
    name: Runtime validation
    outputs:
      pnpm-cache-hit: ${{ steps.setup.outputs.pnpm-cache-hit }}
      remote-cache-mode: ${{ steps.setup.outputs.remote-cache-mode }}
      setup-seconds: ${{ steps.setup.outputs.setup-seconds }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Azure/setup-kubectl@v5.1.0
      - id: setup
        uses: ./.github/actions/setup-environment
      - name: Validate runtime artifacts
        run: pnpm run runtime:check

  ci-metrics:
    name: CI rollout metrics
    if: always()
    needs: [check, metadata, e2e, mobile-android, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Collect validation timing and retry data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          curl --fail --retry 2 --retry-all-errors --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --output "$RUNNER_TEMP/ci-jobs.json"
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const response = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/ci-jobs.json", "utf8"));
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const slug = (name) => name.toLowerCase().replaceAll(/[^a-z0-9]+/g, "-").replaceAll(/(^-|-$)/g, "");
          const jobByName = new Map(response.jobs.map((job) => [slug(job.name), job]));
          const jobNames = {
            metadata: "Metadata validation",
            e2e: "Production-image E2E",
            "mobile-android": "Android shell validation",
            runtime: "Runtime validation",
          };
          const jobs = Object.entries(needs).map(([id, need]) => {
            const job = jobByName.get(slug(jobNames[id] || id));
            const outputs = need.outputs ?? {};
            const startedAt = job?.started_at ?? null;
            const completedAt = job?.completed_at ?? null;
            return {
              id,
              result: need.result,
              setupSeconds: Number(outputs["setup-seconds"] || 0),
              pnpmCacheHit: outputs["pnpm-cache-hit"] || "not-recorded",
              remoteCacheMode: outputs["remote-cache-mode"] || "not-recorded",
              startedAt,
              completedAt,
              wallSeconds: startedAt && completedAt ? Math.round((Date.parse(completedAt) - Date.parse(startedAt)) / 1000) : null,
            };
          });
          const timestamps = jobs.flatMap((job) => [job.startedAt, job.completedAt]).filter(Boolean).map(Date.parse);
          const metrics = {
            schemaVersion: 1,
            capturedAt: new Date().toISOString(),
            run: {
              id: process.env.GITHUB_RUN_ID,
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              event: process.env.GITHUB_EVENT_NAME,
              workflow: process.env.GITHUB_WORKFLOW,
            },
            validationWallSeconds: timestamps.length ? Math.round((Math.max(...timestamps) - Math.min(...timestamps)) / 1000) : null,
            jobs,
          };
          const artifactDir = join("artifacts", "ci-metrics");
          await mkdir(artifactDir, { recursive: true });
          await writeFile(join(artifactDir, `run-${metrics.run.id}-attempt-${metrics.run.attempt}.json`), `${JSON.stringify(metrics, null, 2)}\n`);
          const rows = jobs.map((job) => `| ${job.id} | ${job.result} | ${job.setupSeconds || "n/a"} | ${job.wallSeconds ?? "n/a"} | ${job.pnpmCacheHit} | ${job.remoteCacheMode} |`);
          await writeFile(process.env.GITHUB_STEP_SUMMARY, [
            "## CI rollout metrics",
            "",
            `Run attempt: ${metrics.run.attempt}; validation wall time: ${metrics.validationWallSeconds ?? "n/a"}s.`,
            "",
            "| Job | Result | Setup (s) | Wall (s) | pnpm cache | Turbo cache |",
            "| --- | --- | ---: | ---: | --- | --- |",
            ...rows,
            "",
            "Retry/noise data is the run attempt above; compare this artifact across the rollout sample.",
            "",
          ].join("\n"));
          NODE
      - name: Upload CI rollout metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-metrics/
          if-no-files-found: error
          retention-days: 14
