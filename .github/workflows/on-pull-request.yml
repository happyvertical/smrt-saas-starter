name: Pull Request

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GH_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: smrt_saas
          POSTGRES_PASSWORD: localdev
          POSTGRES_USER: smrt_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smrt_saas -d smrt_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 36
    env:
      DATABASE_URL: postgresql://smrt_saas:localdev@127.0.0.1:5432/smrt_saas
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
      - name: Validate
        run: pnpm check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
      - name: Install Playwright browsers
        run: pnpm --filter @happyvertical/smrt-saas-web exec playwright install --with-deps chromium
      - name: Production-image browser and migration gate
        run: pnpm test:e2e:production
      - name: Upload production E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/production-e2e/
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

  mobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: ./.github/actions/setup-environment
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate Android shell
        run: pnpm mobile:validate:android

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Azure/setup-kubectl@v5.1.0
      - uses: ./.github/actions/setup-environment
      - name: Validate runtime artifacts
        run: pnpm runtime:check
