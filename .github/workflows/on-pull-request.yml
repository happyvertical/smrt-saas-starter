name: Pull Request

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - name: Validate
        run: pnpm check
