name: Deploy Staging

on:
  push:
    branches: [staging]
    paths:
      - "apps/web/**"
      - "apps/worker/**"
      - "packages/app-objects/**"
      - "packages/app-ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/prepare-runtime.mjs"
      - "**/Dockerfile*"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA to deploy
        required: true
      candidate_run_id:
        description: Explicit recovery-build run ID
        required: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write
  pull-requests: write

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
      - uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - uses: ./.github/actions/promote-candidate
        id: promote
        with:
          environment: staging
          source-sha: ${{ env.SOURCE_SHA }}
          candidate-run-id: ${{ inputs.candidate_run_id }}
      - name: Commit staging manifest digest
        run: |
          if ! git diff --quiet -- manifests/overlays/staging/kustomization.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifests/overlays/staging/kustomization.yaml
            git commit -m "chore(deploy): update staging image digests [skip ci]"
            git push origin HEAD:staging
          fi
      - name: Setup deployed-smoke dependencies
        if: vars.STAGING_BASE_URL != ''
        uses: ./.github/actions/setup-environment
        with:
          setup-playwright: "true"
      - name: Smoke staging deployment
        if: vars.STAGING_BASE_URL != ''
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          EXPECTED_APP_VERSION: ${{ steps.promote.outputs.app-version }}
          E2E_AUTH_SECRET: ${{ secrets.E2E_AUTH_SECRET }}
          E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL }}
        run: |
          node scripts/wait-for-deploy.mjs "$PLAYWRIGHT_BASE_URL" "$EXPECTED_APP_VERSION"
          if [ -n "$E2E_AUTH_SECRET" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "x-e2e-auth: $E2E_AUTH_SECRET" \
              "$PLAYWRIGHT_BASE_URL/api/e2e/session" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::warning::Deployed authenticated E2E endpoint is unavailable; running public specs only."
              unset E2E_AUTH_SECRET
            fi
          fi
          pnpm --filter @happyvertical/smrt-saas-web test:e2e
      - name: Open staging to main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head staging \
            --title "chore: promote staging to main" \
            --body "Automated promotion of the verified staging candidate." \
          || gh pr list --base main --head staging --json url --jq '.[0].url'
