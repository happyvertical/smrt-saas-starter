name: Deploy Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GH_TOKEN }}

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: smrt_saas
          POSTGRES_PASSWORD: localdev
          POSTGRES_USER: smrt_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smrt_saas -d smrt_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://smrt_saas:localdev@127.0.0.1:5432/smrt_saas
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
      - name: Validate staging
        run: pnpm check
      - name: Build staging images
        run: |
          echo "Build and push web/worker images tagged staging-${GITHUB_SHA::12} and staging-latest"
      - name: Update staging manifests
        run: |
          echo "Patch manifests/overlays/staging with immutable image digests"
      - name: Open staging to main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head staging \
            --title "chore: promote staging to main" \
            --body "Automated promotion from staging to main." \
          || gh pr list --base main --head staging --json url --jq '.[0].url'
