name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore: [manifests/overlays/production/kustomization.yaml]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA to deploy
        required: true
      candidate_run_id:
        description: Explicit recovery-build run ID
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write
  pull-requests: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || 'main' }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
      - uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - uses: ./.github/actions/promote-candidate
        with:
          environment: production
          source-sha: ${{ env.SOURCE_SHA }}
          candidate-run-id: ${{ inputs.candidate_run_id }}
      - name: Commit production manifest digest
        run: |
          if ! git diff --quiet -- manifests/overlays/production/kustomization.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifests/overlays/production/kustomization.yaml
            git commit -m "chore(deploy): update production image digests [skip ci]"
            git push origin HEAD:main
          fi
      - name: Sync main back to dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base dev --head main \
            --title "chore: sync main back to dev" \
            --body "Automated sync after production deployment." \
          || gh pr list --base dev --head main --json url --jq '.[0].url'
